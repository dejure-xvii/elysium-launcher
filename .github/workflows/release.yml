name: Release

# Push a tag like v1.1.0 (matching the version in tauri.conf.json) to build
# the signed installer and publish it with latest.json for the auto-updater.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ELYSIUM_MS_CLIENT_ID: ${{ secrets.ELYSIUM_MS_CLIENT_ID }}
        with:
          tagName: v__VERSION__
          releaseName: Elysium Launcher v__VERSION__
          releaseBody: Скачайте `Elysium Launcher_*_x64-setup.exe` и запустите установщик.
          releaseDraft: false
          prerelease: false
