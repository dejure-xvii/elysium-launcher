name: Release

# Push a tag like v1.1.0 (matching the version in tauri.conf.json) to build
# the signed installer and publish it with latest.json for the auto-updater.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ELYSIUM_MS_CLIENT_ID: ${{ secrets.ELYSIUM_MS_CLIENT_ID }}
        with:
          tagName: v__VERSION__
          releaseName: Elysium Launcher v__VERSION__
          releaseBody: Обновление для установленных лаунчеров. Установщик скачивается в личном кабинете на сайте Elysium (нужна активная подписка).
          releaseDraft: false
          prerelease: false

      # The installer is also uploaded to the private R2 bucket: the site gives it out only in the
      # cabinet, to accounts with an active subscription (elysium-site/auth/src/releases.js). The GitHub
      # release above stays for the auto-updater of installed launchers (latest.json).
      # Secrets: CLOUDFLARE_API_TOKEN ("Workers R2 Storage: Edit"), CLOUDFLARE_ACCOUNT_ID.
      - name: Upload installer to R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          exe=$(ls src-tauri/target/release/bundle/nsis/*_x64-setup.exe | head -1)
          name=$(basename "$exe")
          npx --yes wrangler@4.149.0 r2 object put "elysium-releases/launcher/$name" --remote --file "$exe" --content-type application/octet-stream
          node -e "process.stdout.write(JSON.stringify({version: process.argv[1], file: 'launcher/' + process.argv[2]}))" "$version" "$name" > latest-launcher.json
          npx --yes wrangler@4.149.0 r2 object put elysium-releases/launcher/latest.json --remote --file latest-launcher.json --content-type application/json
